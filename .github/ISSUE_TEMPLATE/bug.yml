name: Bug report / 问题反馈
description: Something does not work on the television / 电视上有东西不工作
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Installed the release `.wgt` (Apps2Samsung)?** Right after the problem
        happens, open 设置 (Settings) on the TV, find 诊断日志 (diagnostic logs) and
        press 上传诊断日志 (upload). Copy the TV's code from the line under it
        (这台电视的编号, like `ABCD-1234`) into the form below. That is the log; you
        can skip the log fields. Versions from 1.3.2 have this.

        **用发布包装的（Apps2Samsung）**：出问题之后尽快打开电视上的「设置」页签，找到「诊断日志」，
        按「上传诊断日志」，把下面那行里「这台电视的编号」（形如 `ABCD-1234`）填进表里就行，
        日志会自己传过来，下面贴日志的几栏不用管。1.3.2 起的版本有这一项。

        **Built from source?** Please attach the collector log. The television
        closes `dlog`, the Web Inspector and `sdb shell`, so the app's own reports
        are the only evidence there is.

        **从源码装的**：请附上收集器日志。零售机把 `dlog`、Web Inspector 和 `sdb shell`
        全关了，应用自己的上报是唯一的证据来源。

        ```bash
        node tools/collect.mjs | tee /tmp/bili.log   # 开着它，再复现一次
        ```

  - type: input
    id: model
    attributes:
      label: TV model and year / 电视型号和年份
      description: e.g. UE65CU7090 (2023). Settings > Support > About / 设置 > 支持 > 关于本机
      placeholder: UE65CU7090, 2023
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happens / 现象
      description: |
        What you saw on screen, and what you expected. If it is playback, say
        whether the screen was black, frozen, spinning, or dropped back to the
        grid — those are four different faults.

        屏幕上看到什么、你期待什么。如果是播放问题，说清楚是黑屏、卡住不动、
        一直转圈、还是自己退回了网格 —— 那是四种不同的故障。
    validations:
      required: true

  - type: input
    id: diag
    attributes:
      label: TV code from 诊断日志 / 设置里「诊断日志」那一行的电视编号
      description: |
        Release package: press 上传诊断日志 first, then copy the code.
        发布包：先按「上传诊断日志」，再抄编号。
      placeholder: ABCD-1234

  - type: input
    id: bvid
    attributes:
      label: Which video, if it is one video / 如果只有某个视频不行，是哪个
      description: |
        The bvid, and the part number for a multi-part upload. "Some videos will
        not play" cannot be chased any further than guessing without this — it is
        why every playback log line in this project carries the bvid.

        bvid，分 P 稿件请带上第几 P。「有些视频打不开」没有这个就只能猜 ——
        这也是这个项目每条播放日志都带 bvid 的原因。
      placeholder: BV1xx411c7XD, P10

  - type: input
    id: version
    attributes:
      label: Version / 版本
      description: |
        Release package: the 版本 at the top of 设置. From source: `git rev-parse --short HEAD`.
        发布包：「设置」页最上面写的版本。从源码装的：`git rev-parse --short HEAD`。
      placeholder: 1.3.2  |  45799cf

  - type: textarea
    id: engine
    attributes:
      label: From source — the `engine:` line / 从源码装的：启动时的 `engine:` 那一行
      description: |
        Printed by every build at startup. It settles what the platform actually
        is instead of what anyone assumes — this project shipped a wrong
        assumption about it for months. The uploaded diagnostic log has it already.

        每个构建启动时都会打。它能定下平台到底是什么，而不是谁猜它是什么 ——
        这个项目曾经为一个错误的假设付出过几个月。上传的诊断日志里已经有它。
      render: text
      placeholder: |
        engine: Mozilla/5.0 (SMART-TV; LINUX; Tizen 9.0) … 120.0.6099.5 | ES6=true | MSE=true | …

  - type: textarea
    id: log
    attributes:
      label: From source — collector log / 从源码装的：收集器日志
      description: |
        From `node tools/collect.mjs`, covering the failure. Include the lines
        before it, not only the error — `到画面`, `编码`, `dash offers`,
        `progressive gave` and `卡住 / 跳转` are usually where the answer is.
        Start the collector before the app: after five missed reports the app
        waits five minutes before trying again (redeploying reconnects at once).

        来自 `node tools/collect.mjs`，覆盖出问题的那一段。**把前面的行也贴上**，
        不要只贴报错 —— 答案通常在 `到画面`、`编码`、`dash offers`、
        `progressive gave`、`卡住 / 跳转` 这些行里。收集器要在应用启动之前开着：
        应用连撞五次失败会等五分钟再试（重新部署立刻恢复）。
      render: text
